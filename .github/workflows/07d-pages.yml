#
# L2 / SEC-P0-009 + SEC-P0-010:
# - o build corre só com `contents: read`; as permissões de publicação
#   (`pages: write`, `id-token: write`) existem apenas no job `deploy`;
# - o build de produção declara `MILREU_ENVIRONMENT: production`, activando as
#   asserções de ambiente (HTTPS obrigatório, demo proibida);
# - `public_base_url` é validado antes do build;
# - o perfil de deployment é regenerado no build (deixa de ser publicado o
#   ficheiro estático versionado com `environment: local`).

name: Publish Technical MVP to Pages

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escrever PUBLISH_TECHNICAL_MVP"
        required: true
        type: string
      public_base_url:
        description: "URL pública final, incluindo subdiretório quando existir"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: ${{ inputs.confirmation == 'PUBLISH_TECHNICAL_MVP' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # configure-pages só lê a configuração do site (sem capacidade de publicar).
      pages: read
    env:
      MILREU_ENVIRONMENT: production
      MILREU_PUBLIC_BASE_URL: ${{ inputs.public_base_url }}
      MILREU_SITE_URL: ${{ inputs.public_base_url }}
      MILREU_SUPABASE_URL: ${{ secrets.MILREU_SUPABASE_URL }}
      MILREU_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.MILREU_SUPABASE_PUBLISHABLE_KEY }}
      # URL público da função serverless do formulário "Quero expor" (não é credencial).
      # Mantém o site estático (sem cliente Supabase); null/ausente => formulário em demo.
      MILREU_EXPOR_ENDPOINT: ${{ vars.MILREU_EXPOR_ENDPOINT }}
      MILREU_ALLOW_DEMO: "false"
    steps:
      - name: Validar URL pública
        shell: bash
        run: |
          set -euo pipefail
          url_re='^https://[A-Za-z0-9.-]+(/[A-Za-z0-9._~/-]*)?$'
          [[ "$MILREU_PUBLIC_BASE_URL" =~ $url_re ]] || { echo "::error::public_base_url tem de ser um URL https:// válido."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run collab:config
      # Nota: a geração de QR final (channels:qr:generate) NÃO corre aqui.
      # Gravar o domínio público e marcar os QR como "generated" é uma ação
      # de lançamento com gate humano (ver .claude/rules/qr-requires-public-domain.md
      # e public-release-gated.md). O validate-channels exige, corretamente, que o
      # pacote não invente um domínio público. O deploy técnico permanece noindex/
      # editorial-preview e mantém os QR em estado "pending".
      - run: npm run channels:export
      - run: npm run museum:index
      - run: npm run museum:audit
      - run: npm run validate
      - run: npm test
      # Regenerar o perfil de deployment DEPOIS dos testes: os testes validam o perfil
      # versionado (inicial, `local`); o site publicado recebe o perfil de produção.
      - run: npm run deploy:profile
      - run: npm run build
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    name: 07d-pages-deploy
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
