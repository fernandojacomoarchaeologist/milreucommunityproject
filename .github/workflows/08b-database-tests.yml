name: 08B Database Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/collab/**"
      - "scripts/admin/**"
      - ".github/workflows/08b-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: 08b-database-tests-database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase db reset
      - name: Test 08A foundation
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/collab-tests/008a_collaborative_foundation.test.sql
      - name: Test 08B member management
        run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 \
            -f supabase/collab-tests/008b_member_management.test.sql
      - if: always()
        run: supabase stop --no-backup
