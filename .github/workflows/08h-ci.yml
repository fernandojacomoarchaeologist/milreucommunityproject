name: 08H Notifications CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 08h-ci-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deploy:profile
      - run: npm run deploy:preflight
      - run: npm run deploy:oauth-check
      - run: npm run notifications:config
      - run: npm run notifications:preview
      - run: npm run notifications:test-payload
      - run: npm run notifications:dispatch-status
      - run: npm run collab:config
      - run: npm run museum:review-export
      - run: npm run museum:review-apply
      - run: npm run contributions:demo-export
      - run: npm run exhibitions:export
      - run: npm run channels:export
      - run: npm run museum:index
      - run: npm run museum:audit
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke
