name: 08H Deploy Notification Worker

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escreva DEPLOY_MILREU_NOTIFICATION_WORKER_STAGING"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: milreu-notification-worker-staging
  cancel-in-progress: false

jobs:
  deploy:
    # L2: staging só corre com a variável MILREU_STAGING_ENABLED=true — impede que o
    # GitHub crie automaticamente um environment `staging` sem protecções.
    if: ${{ inputs.confirmation == 'DEPLOY_MILREU_NOTIFICATION_WORKER_STAGING' && vars.MILREU_STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    # L2 / SEC-P0-007: credenciais só no step de deploy.
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.109.1
      - run: supabase functions deploy dispatch-collab-notifications --project-ref "$STAGING_PROJECT_ID" --no-verify-jwt
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
      - run: |
          echo "Worker publicado em staging."
          echo "O canal de e-mail e o agendamento continuam desativados."
