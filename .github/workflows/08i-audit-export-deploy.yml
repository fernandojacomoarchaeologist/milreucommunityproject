# L1-08/09 (2026-10-15): staging usa STAGING_SUPABASE_ACCESS_TOKEN (token próprio, limitado ao
# projecto de staging); nunca o SUPABASE_ACCESS_TOKEN de produção, mesmo que exista no repositório.
name: 08I Deploy Audit Export

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escreva DEPLOY_MILREU_AUDIT_EXPORT_STAGING"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: milreu-audit-export-staging
  cancel-in-progress: false

jobs:
  deploy:
    name: 08i-audit-export-deploy-deploy
    # L2: staging só corre com a variável MILREU_STAGING_ENABLED=true — impede que o
    # GitHub crie automaticamente um environment `staging` sem protecções.
    if: ${{ inputs.confirmation == 'DEPLOY_MILREU_AUDIT_EXPORT_STAGING' && vars.MILREU_STAGING_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    # L2 / SEC-P0-007: credenciais só no step de deploy.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1
      - run: supabase functions deploy export-collab-audit --project-ref "$STAGING_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
          STAGING_PROJECT_ID: ${{ secrets.STAGING_PROJECT_ID }}
      - run: |
          echo "Exportação de auditoria publicada em staging."
          echo "Nenhuma retenção ou mutação de produção foi executada."
