name: 08I Database Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/operations/**"
      - ".github/workflows/08i-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase start
      - run: supabase db reset
      - run: |
          for test_file in             supabase/collab-tests/008a_collaborative_foundation.test.sql             supabase/collab-tests/008b_member_management.test.sql             supabase/collab-tests/008c_volunteering_tasks.test.sql             supabase/collab-tests/008d_agenda_exhibitions.test.sql             supabase/collab-tests/008e_contributions.test.sql             supabase/collab-tests/008f_museum_review.test.sql             supabase/collab-tests/008g_deployment_homologation.test.sql             supabase/collab-tests/008h_notifications.test.sql             supabase/collab-tests/008i_operations_governance.test.sql
          do
            psql postgresql://postgres:postgres@127.0.0.1:54322/postgres               -v ON_ERROR_STOP=1 -f "$test_file"
          done
      - if: always()
        run: supabase stop --no-backup
