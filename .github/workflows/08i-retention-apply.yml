#
# L2 / SEC-P0-001: nenhum input é interpolado em `run:`. Todos os inputs entram
# por `env:` e são comparados como dados (aspas), nunca como código. A confirmação
# literal é também exigida no `if:` do job (avaliada pelo GitHub, não pelo bash).
# O ambiente `staging` só é aceite com a variável `MILREU_STAGING_ENABLED=true`,
# para impedir a criação automática de um environment sem protecções.

name: 08I Apply Approved Retention

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente protegido"
        required: true
        type: choice
        options: [staging, production]
      run_id:
        description: "UUID da execução aprovada"
        required: true
        type: string
      confirmation:
        description: "APPLY_MILREU_RETENTION_POLICY"
        required: true
        type: string
      production_confirmation:
        description: "Em produção: APPLY_MILREU_PRODUCTION_RETENTION"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: milreu-retention-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  apply:
    if: >-
      ${{ inputs.confirmation == 'APPLY_MILREU_RETENTION_POLICY'
      && (inputs.environment == 'production' || vars.MILREU_STAGING_ENABLED == 'true') }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Validate confirmations
        shell: bash
        env:
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "APPLY_MILREU_RETENTION_POLICY" ]] || { echo "::error::Confirmação inválida."; exit 1; }
          if [[ "$TARGET_ENVIRONMENT" == "production" ]]; then
            [[ "$PRODUCTION_CONFIRMATION" == "APPLY_MILREU_PRODUCTION_RETENTION" ]] || { echo "::error::Confirmação de produção inválida."; exit 1; }
          fi
          uuid_re='^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$'
          [[ "$RUN_ID" =~ $uuid_re ]] || { echo "::error::run_id não é um UUID válido."; exit 1; }
      - name: Apply one approved run
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RUN_ID: ${{ inputs.run_id }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_URL"
          test -n "$SUPABASE_SERVICE_ROLE_KEY"
          body="$(jq -n             --arg run "$RUN_ID"             --arg confirmation "APPLY_MILREU_RETENTION_POLICY"             --arg production "$PRODUCTION_CONFIRMATION"             '{
              p_run_id:$run,
              p_confirmation:$confirmation,
              p_production_confirmation:($production|select(length>0))
            }')"
          curl --fail-with-body --silent --show-error             --request POST             --header "apikey: $SUPABASE_SERVICE_ROLE_KEY"             --header "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY"             --header "Content-Type: application/json"             --data "$body"             "$SUPABASE_URL/rest/v1/rpc/collab_apply_retention_run_08i"
