name: 08J Quality and Release Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/08j-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    name: 08j-ci-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:08j
      - run: npm test
      - run: npm run e2e:08j
      - run: npm run build
      - run: npm run smoke
      - name: Evaluate technical release candidate
        run: npm run rc:evaluate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: milreu-08j-quality-evidence
          path: |
            reports/
            public/data/release-candidate-readiness.json
          if-no-files-found: warn
