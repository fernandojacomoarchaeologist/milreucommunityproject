name: 08J Quality and Release Candidate

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "src/**"
      - "public/**"
      - "scripts/**"
      - "tests/**"
      - "package*.json"
      - ".github/workflows/08j-ci.yml"

permissions:
  contents: read

jobs:
  quality:
    name: 08j-ci-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:08j
      - run: npm test
      - run: npm run e2e:08j
      - run: npm run build
      - run: npm run smoke
      - name: Evaluate technical release candidate
        run: npm run rc:evaluate
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: milreu-08j-quality-evidence
          path: |
            reports/
            public/data/release-candidate-readiness.json
          if-no-files-found: warn
