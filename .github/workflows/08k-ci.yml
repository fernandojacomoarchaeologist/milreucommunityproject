name: 08K Pilot CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pilot:validate
      - run: npm run pilot:scenario-matrix
      - run: npm run pilot:readiness
      - run: npm run pilot:gates
      - run: npm run pilot:evidence-bundle
      - run: npm run validate:08k
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke
