name: 08K Pilot CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 08k-ci-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pilot:validate
      - run: npm run pilot:scenario-matrix
      - run: npm run pilot:readiness
      - run: npm run pilot:gates
      - run: npm run pilot:evidence-bundle
      - run: npm run validate:08k
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke
