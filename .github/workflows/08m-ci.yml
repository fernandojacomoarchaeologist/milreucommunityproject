name: 08M Operations Governance CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 08m-ci-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run operations:validate
      - run: npm run operations:continuity
      - run: npm run operations:readiness
      - run: npm run operations:health
      - run: npm run operations:transparency
      - run: npm run operations:decommission
      - run: npm run validate:08m
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke
