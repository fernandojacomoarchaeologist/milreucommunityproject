name: 08M Operations Governance CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 08m-ci-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run operations:validate
      - run: npm run operations:continuity
      - run: npm run operations:readiness
      - run: npm run operations:health
      - run: npm run operations:transparency
      - run: npm run operations:decommission
      - run: npm run validate:08m
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke
