name: 08M Database Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - "scripts/operations-governance/**"
      - ".github/workflows/08m-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: 08m-database-tests-database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase db reset
      - run: |
          for test_file in \
            supabase/collab-tests/008a_collaborative_foundation.test.sql \
            supabase/collab-tests/008b_member_management.test.sql \
            supabase/collab-tests/008c_volunteering_tasks.test.sql \
            supabase/collab-tests/008d_agenda_exhibitions.test.sql \
            supabase/collab-tests/008e_contributions.test.sql \
            supabase/collab-tests/008f_museum_review.test.sql \
            supabase/collab-tests/008g_deployment_homologation.test.sql \
            supabase/collab-tests/008h_notifications.test.sql \
            supabase/collab-tests/008i_operations_governance.test.sql \
            supabase/collab-tests/008k_pilot.test.sql \
            supabase/collab-tests/008l_public_integration.test.sql \
            supabase/collab-tests/008m_operations_governance.test.sql
          do
            psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
              -v ON_ERROR_STOP=1 -f "$test_file"
          done
      - if: always()
        run: supabase stop --no-backup
