name: 08N Database Tests

on:
  pull_request:
    paths:
      - "supabase/**"
      - ".github/workflows/08n-database-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: 08n-database-tests-database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase db reset
      - run: |
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 -f supabase/collab-tests/008e_contributions.test.sql
          psql postgresql://postgres:postgres@127.0.0.1:54322/postgres \
            -v ON_ERROR_STOP=1 -f supabase/collab-tests/008n_file_limit.test.sql
      - if: always()
        run: supabase stop --no-backup
