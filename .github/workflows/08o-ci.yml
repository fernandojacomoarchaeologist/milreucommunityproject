name: 08O Post-merge Fixes CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 08o-ci-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run carousel:validate
      - run: npm run audit:collaborative
      - run: npm run fixtures:validate
      - run: npm run validate:08o
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  carousel-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-latest inclui google-chrome-stable; o runner deteta /usr/bin/google-chrome.
      - name: E2E do carrossel em browser real (relógio real)
        run: npm run e2e:08o
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: milreu-08o-carousel-e2e
          path: reports/e2e-result.json
          if-no-files-found: warn
