name: 08O Post-merge Fixes CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 08o-ci-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run carousel:validate
      - run: npm run audit:collaborative
      - run: npm run fixtures:validate
      - run: npm run validate:08o
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  carousel-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # ubuntu-latest inclui google-chrome-stable; o runner deteta /usr/bin/google-chrome.
      - name: E2E do carrossel em browser real (relógio real)
        run: npm run e2e:08o
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: milreu-08o-carousel-e2e
          path: reports/e2e-result.json
          if-no-files-found: warn
