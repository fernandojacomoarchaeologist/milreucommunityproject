name: 08P Functional Closure CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 08p-ci-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run closure:matrix
      - run: npm run closure:first-access
      - run: npm run closure:deep-links
      - run: npm run closure:fixtures
      - run: npm run closure:report
      - run: npm run validate:08p
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  role-profile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # E2E por perfil (anónimo/pendente/voluntário/master) + fecho funcional; ubuntu-latest tem google-chrome.
      - name: E2E por perfil em browser real
        run: npm run e2e:08p
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: milreu-08p-role-e2e
          path: |
            reports/e2e-result.json
            reports/role-access-matrix-08p.json
            reports/functional-closure-08p.json
          if-no-files-found: warn
