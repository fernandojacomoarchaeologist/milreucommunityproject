name: 08P Functional Closure CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 08p-ci-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run closure:matrix
      - run: npm run closure:first-access
      - run: npm run closure:deep-links
      - run: npm run closure:fixtures
      - run: npm run closure:report
      - run: npm run validate:08p
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  role-profile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # E2E por perfil (anónimo/pendente/voluntário/master) + fecho funcional; ubuntu-latest tem google-chrome.
      - name: E2E por perfil em browser real
        run: npm run e2e:08p
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: milreu-08p-role-e2e
          path: |
            reports/e2e-result.json
            reports/role-access-matrix-08p.json
            reports/functional-closure-08p.json
          if-no-files-found: warn
