name: 08Q Banner Hotfix and Responsive CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 08q-ci-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run banner:validate
      - run: npm run responsive:audit
      - run: npm run responsive:overflow
      - run: npm run responsive:report
      - run: npm run validate:08q
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  banner-geometry-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Geometria do banner em browser real (caixa igual, conteúdo dentro, sem h-scroll) por viewport.
      - name: E2E de geometria do banner
        run: npm run e2e:08q
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: milreu-08q-banner-e2e
          path: |
            reports/e2e-result.json
            reports/responsive-audit-08q.json
          if-no-files-found: warn
