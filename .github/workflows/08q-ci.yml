name: 08Q Banner Hotfix and Responsive CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: 08q-ci-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run banner:validate
      - run: npm run responsive:audit
      - run: npm run responsive:overflow
      - run: npm run responsive:report
      - run: npm run validate:08q
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  banner-geometry-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Geometria do banner em browser real (caixa igual, conteúdo dentro, sem h-scroll) por viewport.
      - name: E2E de geometria do banner
        run: npm run e2e:08q
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: milreu-08q-banner-e2e
          path: |
            reports/e2e-result.json
            reports/responsive-audit-08q.json
          if-no-files-found: warn
