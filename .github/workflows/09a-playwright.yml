name: 09A Portal Quality (Playwright)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Versão fixa do Playwright instalada ad-hoc (não entra no package-lock para não
  # partir o `npm ci` dos restantes jobs; é uma ferramenta de teste, não runtime).
  PLAYWRIGHT_VERSION: 1.49.1

jobs:
  quality:
    name: 09a-playwright-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:09a
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  e2e-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Playwright ad-hoc (sem tocar no lock)
        run: |
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: E2E geométrico/funcional + no-JS (bloqueante)
        run: npx playwright test
      - name: Repetir cenários críticos (estabilidade/flakes)
        run: npx playwright test tests/e2e/portal/home-carousel.spec.mjs --repeat-each=5
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: milreu-09a-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
