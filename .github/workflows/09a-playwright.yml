name: 09A Portal Quality (Playwright)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Versão fixa do Playwright instalada ad-hoc (não entra no package-lock para não
  # partir o `npm ci` dos restantes jobs; é uma ferramenta de teste, não runtime).
  PLAYWRIGHT_VERSION: 1.49.1

jobs:
  quality:
    name: 09a-playwright-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:09a
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  e2e-playwright:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Playwright ad-hoc (sem tocar no lock)
        run: |
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: E2E geométrico/funcional + no-JS (bloqueante)
        run: npx playwright test
      - name: Repetir cenários críticos (estabilidade/flakes)
        run: npx playwright test tests/e2e/portal/home-carousel.spec.mjs --repeat-each=5
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: milreu-09a-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
