name: 09C.1 Opportunities Functional Closure

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: 1.49.1

jobs:
  quality:
    name: 09c1-ci-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:09c1
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  e2e-opportunities:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Playwright ad-hoc (sem tocar no lock)
        run: |
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: E2E da jornada de oportunidades + render de rotas colaborativas (demo) — bloqueante
        run: npx playwright test tests/e2e/portal/opportunities-journey.spec.mjs tests/e2e/portal/opportunities.spec.mjs tests/e2e/portal/collab-routes-render.spec.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: milreu-09c1-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn

  database:
    name: 09c1-ci-database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          version: 2.109.1
      - run: supabase start
      - run: supabase db reset
      - run: |
          for test_file in \
            supabase/collab-tests/009c_opportunities.test.sql \
            supabase/collab-tests/009c1_opportunities_journey.test.sql; do
            echo "== $test_file ==";
            psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -v ON_ERROR_STOP=1 -f "$test_file";
          done
      - run: supabase stop --no-backup
        if: always()
