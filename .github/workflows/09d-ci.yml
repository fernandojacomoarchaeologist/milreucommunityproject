name: 09D Multilingual Foundation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Versão fixa do Playwright instalada ad-hoc (não entra no package-lock).
  PLAYWRIGHT_VERSION: 1.49.1

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:09d
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  e2e-locale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Playwright ad-hoc (sem tocar no lock)
        run: |
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: E2E seletor + disponibilidade/fallback multilíngue (bloqueante)
        run: npx playwright test tests/e2e/portal/language-selector.spec.mjs tests/e2e/portal/language-availability.spec.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: milreu-09d-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
