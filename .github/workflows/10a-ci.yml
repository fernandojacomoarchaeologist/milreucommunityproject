name: 10A Proteus Manifesto Rights Trust MCP

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:10a
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke
