name: 10B.1 Proteus Catalographic Pilot

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  PLAYWRIGHT_VERSION: 1.49.1

jobs:
  quality:
    name: 10b1-ci-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:10b1
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  e2e-proteus-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Instalar Playwright ad-hoc (sem tocar no lock)
        run: |
          npm install --no-save "@playwright/test@${PLAYWRIGHT_VERSION}"
          npx playwright install --with-deps chromium
      - run: npm run build
      - name: E2E da Biblioteca Proteus (piloto controlado, acesso aberto vs externo, 404 de privados) — bloqueante
        run: npx playwright test tests/e2e/portal/proteus-library-10b.spec.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: milreu-10b1-playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
