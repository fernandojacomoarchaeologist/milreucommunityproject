name: 10C.1 Proteus Verifiable Assertions Pilot

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: 10c1-ci-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:10c1
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  open-science-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: O snapshot servido continua sem conteúdo in_review (public-git-content PASS)
        run: python3 scripts/governance/open_science_gate.py --profile public-git-content
