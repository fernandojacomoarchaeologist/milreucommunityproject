name: 10C.1 Proteus Verifiable Assertions Pilot

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: 10c1-ci-quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run validate:10c1
      - run: npm run validate
      - run: npm test
      - run: npm run build
      - run: npm run smoke

  open-science-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: O snapshot servido continua sem conteúdo in_review (public-git-content PASS)
        run: python3 scripts/governance/open_science_gate.py --profile public-git-content
