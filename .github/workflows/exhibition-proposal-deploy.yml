#
# Deploy + smoke test da Edge Function "exhibition-proposal-intake" (formulário "Quero expor").
# A função só NOTIFICA por e-mail (não grava em DB). Secrets sensíveis vêm de GitHub Secrets;
# config não-sensível vem de GitHub Variables (vars). Nada hardcoded. Sem secrets a função
# falha fechada (503). Ver docs/website/ITEM02_FORM_DEPLOY_PREP.md.
#
# Pré-requisito independente: o SITE tem de ser publicado em modo "supabase"
# (secrets MILREU_SUPABASE_URL + MILREU_SUPABASE_PUBLISHABLE_KEY no deploy do Pages),
# senão o frontend fica em "demo" e nunca chama esta função. Hoje o site está em demo.

name: Deploy Exhibition Proposal Intake

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escreva DEPLOY_EXHIBITION_PROPOSAL_INTAKE"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: milreu-exhibition-proposal-intake
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY_EXHIBITION_PROPOSAL_INTAKE' }}
    runs-on: ubuntu-latest
    env:
      # --- SENSÍVEIS (GitHub Secrets) ---
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      EXPOR_RESEND_API_KEY: ${{ secrets.EXPOR_RESEND_API_KEY }}
      EXPOR_NOTIFY_RECIPIENTS: ${{ secrets.EXPOR_NOTIFY_RECIPIENTS }}
      # --- NÃO-SENSÍVEIS (GitHub Variables) ---
      PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
      EXPOR_EMAIL_FROM: ${{ vars.EXPOR_EMAIL_FROM }}
      # Origem pública conhecida (default); pode ser sobreposta por vars.EXPOR_ALLOWED_ORIGINS.
      ALLOWED_ORIGINS: ${{ vars.EXPOR_ALLOWED_ORIGINS || 'https://projectomilreu.pt' }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Validar configuração presente (sem imprimir valores)
        run: |
          set -euo pipefail
          miss=0
          for v in SUPABASE_ACCESS_TOKEN EXPOR_RESEND_API_KEY EXPOR_NOTIFY_RECIPIENTS PROJECT_REF EXPOR_EMAIL_FROM ALLOWED_ORIGINS; do
            if [ -z "${!v:-}" ]; then echo "::error::$v em falta (ver ITEM02_FORM_DEPLOY_PREP.md)"; miss=1; fi
          done
          [ "$miss" = "0" ] || exit 1
      - name: Aplicar secrets à função (nunca impressos)
        run: |
          set -euo pipefail
          supabase secrets set \
            EXPOR_RESEND_API_KEY="$EXPOR_RESEND_API_KEY" \
            EXPOR_EMAIL_FROM="$EXPOR_EMAIL_FROM" \
            EXPOR_NOTIFY_RECIPIENTS="$EXPOR_NOTIFY_RECIPIENTS" \
            ALLOWED_ORIGINS="$ALLOWED_ORIGINS" \
            --project-ref "$PROJECT_REF"
      - name: Publicar a função
        # Endpoint público: a função protege-se por origin allowlist + honeypot + validação
        # estrita + consentimento obrigatório (não usa a verificação de JWT da plataforma).
        run: supabase functions deploy exhibition-proposal-intake --project-ref "$PROJECT_REF" --no-verify-jwt
      - name: Smoke test (sem enviar e-mail)
        run: |
          set -euo pipefail
          URL="https://${PROJECT_REF}.supabase.co/functions/v1/exhibition-proposal-intake"
          # 1) Honeypot preenchido -> 200 ok:true, reference:null (NÃO envia e-mail).
          hp=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" -H "content-type: application/json" --data '{"website":"bot","payload":{}}')
          echo "honeypot -> HTTP $hp (esperado 200)"
          [ "$hp" = "200" ] || { echo "::error::smoke honeypot falhou ($hp)"; exit 1; }
          # 2) Payload inválido -> 422 (prova validação, sem envio).
          inv=$(curl -s -o /dev/null -w "%{http_code}" -X POST "$URL" -H "content-type: application/json" --data '{"payload":{"email":"invalido"}}')
          echo "inválido -> HTTP $inv (esperado 422)"
          [ "$inv" = "422" ] || { echo "::error::smoke validação falhou ($inv)"; exit 1; }
          echo "Smoke test OK: função publicada, acessível e a validar. (Envio real de e-mail testado manualmente no QA.)"
