#
# L1-08/09 — Preflight B2 dos secrets de produção (não destrutivo).
# NÃO faz deploy, NÃO altera secrets nem dados, NÃO faz checkout do repositório.
# Só leituras: presença dos secrets (sim/não), acesso do token ao projecto certo,
# âmbito do token (projecto vs conta) e restrição da chave Resend (só envio).
# Corre no environment `production` (branch `main` + aprovação do revisor).
# Plano: docs/security/plans/L1_08_09_SECRETS_MIGRATION_PLAN_2026-10-15.md (§6).
#
# Regras de higiene: sem `set -x`; nenhum valor é ecoado; as saídas do CLI e da API
# vão para ficheiros temporários e só se imprime o resultado da verificação.
# O único input é a confirmação literal, lida por variável de ambiente (nunca
# interpolada em `run:`).

name: L1-08 Production Secrets Preflight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escreva RUN_PRODUCTION_SECRETS_PREFLIGHT"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: milreu-production-secrets-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: l1-08-production-secrets-preflight
    if: ${{ inputs.confirmation == 'RUN_PRODUCTION_SECRETS_PREFLIGHT' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Contexto (branch e environment)
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "RUN_PRODUCTION_SECRETS_PREFLIGHT" ]] || { echo "::error::Confirmação inválida"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Só a partir de main (actual: $GITHUB_REF)"; exit 1; }
          echo "OK  branch main; job no environment production (aprovação registada no run)."

      - name: Presença dos 6 secrets (sim/não)
        env:
          S_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          S_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          S_EXPOR_RESEND_API_KEY: ${{ secrets.EXPOR_RESEND_API_KEY }}
          S_EXPOR_EMAIL_FROM: ${{ secrets.EXPOR_EMAIL_FROM }}
          S_EXPOR_NOTIFY_RECIPIENTS: ${{ secrets.EXPOR_NOTIFY_RECIPIENTS }}
          S_EXPOR_ALLOWED_ORIGINS: ${{ secrets.EXPOR_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF EXPOR_RESEND_API_KEY EXPOR_EMAIL_FROM EXPOR_NOTIFY_RECIPIENTS EXPOR_ALLOWED_ORIGINS; do
            var="S_${name}"
            if [[ -n "${!var}" ]]; then echo "OK  $name presente"; else echo "::error::$name ausente"; missing=1; fi
          done
          exit "$missing"

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.109.1

      - name: Token Supabase — acesso ao projecto e âmbito
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          # 1) Leitura das funções do projecto (Edge Functions: Read). Prova acesso ao projecto certo.
          if supabase functions list --project-ref "$PROJECT_REF" -o json >"$tmp/functions.json" 2>"$tmp/err1"; then
            if jq -e 'map(.slug) | index("exhibition-proposal-intake") != null' "$tmp/functions.json" >/dev/null; then
              echo "OK  token lê as funções do projecto; 'exhibition-proposal-intake' existe"
            else
              echo "::error::Projecto acessível, mas a função 'exhibition-proposal-intake' não foi encontrada (projecto errado?)"; exit 1
            fi
          else
            echo "::error::Token sem acesso às funções do projecto configurado"; exit 1
          fi
          # 2) Nomes dos secrets da função (Edge Function Secrets: Read). Só nomes esperados; sem digests.
          if supabase secrets list --project-ref "$PROJECT_REF" -o json >"$tmp/secrets.json" 2>"$tmp/err2"; then
            for name in EXPOR_RESEND_API_KEY EXPOR_EMAIL_FROM EXPOR_NOTIFY_RECIPIENTS ALLOWED_ORIGINS; do
              if jq -e --arg n "$name" 'map(.name) | index($n) != null' "$tmp/secrets.json" >/dev/null; then echo "OK  função tem $name"; else echo "::warning::função sem $name"; fi
            done
          else
            echo "::warning::Token sem 'Edge Function Secrets: Read' — necessário para 'secrets list' (o deploy usa 'secrets set', que exige Read-write)"
          fi
          # 3) Âmbito: um token limitado ao projecto NÃO deve listar os projectos da conta.
          if supabase projects list -o json >"$tmp/projects.json" 2>"$tmp/err3"; then
            total="$(jq 'length' "$tmp/projects.json")"
            only_this="$(jq --arg r "$PROJECT_REF" '[.[] | (.id // .ref)] == [$r]' "$tmp/projects.json")"
            if [[ "$only_this" == "true" ]]; then
              echo "OK  token só vê o projecto configurado (âmbito limitado ao projecto)"
            else
              echo "::warning::Token vê $total projecto(s) da conta (classic/legacy ou âmbito de conta). Recomendado: token limitado ao projecto."
            fi
          else
            echo "OK  token não lista projectos da conta (âmbito limitado)"
          fi
          echo "NÃO VERIFICÁVEL SEM DEPLOY: 'Edge Functions: Read-write' (functions deploy) e 'Edge Function Secrets: Read-write' (secrets set)."
          rm -rf "$tmp"

      - name: Chave Resend — restrição a envio (sem enviar e-mail)
        env:
          RESEND_KEY: ${{ secrets.EXPOR_RESEND_API_KEY }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          # Endpoint de leitura de domínios: chave de acesso total → 200; chave só de envio → 401 restricted_api_key.
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer ${RESEND_KEY}" https://api.resend.com/domains || true)"
          kind="$(jq -r '.name // empty' "$tmp" 2>/dev/null || true)"
          rm -f "$tmp"
          case "$code:$kind" in
            401:restricted_api_key) echo "OK  chave Resend válida e restrita a envio";;
            200:*) echo "::warning::chave Resend com acesso total (recomendado: só envio, limitada ao domínio)";;
            *) echo "::error::chave Resend inválida ou resposta inesperada (HTTP $code)"; exit 1;;
          esac
          echo "NÃO VERIFICÁVEL SEM ENVIO: restrição ao domínio do remetente."

      - name: Resumo
        run: |
          echo "Preflight concluído sem deploy e sem alterações."
          echo "Regras do environment (branch main, aprovação do revisor): confirmar no registo do run (Approvals) e por API."
