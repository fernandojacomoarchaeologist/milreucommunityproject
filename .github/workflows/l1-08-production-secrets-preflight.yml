#
# L1-08/09 — Preflight B2 dos secrets de produção (não destrutivo).
# NÃO faz deploy, NÃO altera secrets nem dados, NÃO faz checkout do repositório.
# Só leituras: presença dos secrets (sim/não), acesso do token ao projecto certo,
# âmbito do token (projecto vs conta) e restrição da chave Resend (só envio).
# Corre no environment `production` (branch `main` + aprovação do revisor).
# Plano: docs/security/plans/L1_08_09_SECRETS_MIGRATION_PLAN_2026-10-15.md (§6).
#
# Regras de higiene: sem `set -x`; nenhum valor é ecoado; as saídas do CLI e da API
# vão para ficheiros temporários e só se imprime o resultado da verificação.
#
# Estados (sem afirmar mais do que se prova):
#   VERIFIED      — demonstrado por esta execução;
#   NOT VERIFIED  — não é demonstrável sem deploy/envio/revisão externa (ver resumo);
#   UNKNOWN       — a resposta obtida não permite concluir;
#   FAIL          — requisito em falta (o job falha).
# O resumo por propriedade fica em $GITHUB_STEP_SUMMARY (só nomes e estados).
# O único input é a confirmação literal, lida por variável de ambiente (nunca
# interpolada em `run:`).

name: L1-08 Production Secrets Preflight

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Escreva RUN_PRODUCTION_SECRETS_PREFLIGHT"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: milreu-production-secrets-preflight
  cancel-in-progress: false

jobs:
  preflight:
    name: l1-08-production-secrets-preflight
    if: ${{ inputs.confirmation == 'RUN_PRODUCTION_SECRETS_PREFLIGHT' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Contexto (confirmação e branch)
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          [[ "$CONFIRMATION" == "RUN_PRODUCTION_SECRETS_PREFLIGHT" ]] || { echo "::error::Confirmação inválida"; exit 1; }
          [[ "$GITHUB_REF" == "refs/heads/main" ]] || { echo "::error::Só a partir de main"; exit 1; }
          {
            echo "## L1-08 — preflight dos secrets de produção (sem deploy)"
            echo
            echo "| Propriedade | Estado | Nota |"
            echo "|---|---|---|"
            echo "| Execução a partir de \`main\` | VERIFIED | \`GITHUB_REF\` |"
            echo "| Job no environment \`production\` | VERIFIED | declarado no job; os secrets de environment só chegam a jobs deste environment |"
            echo "| Aprovação do revisor aplicada | NOT VERIFIED | não observável dentro do job; confirmar no run (Approvals) ou por API |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Presença dos 6 secrets
        env:
          S_SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          S_SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          S_EXPOR_RESEND_API_KEY: ${{ secrets.EXPOR_RESEND_API_KEY }}
          S_EXPOR_EMAIL_FROM: ${{ secrets.EXPOR_EMAIL_FROM }}
          S_EXPOR_NOTIFY_RECIPIENTS: ${{ secrets.EXPOR_NOTIFY_RECIPIENTS }}
          S_EXPOR_ALLOWED_ORIGINS: ${{ secrets.EXPOR_ALLOWED_ORIGINS }}
        run: |
          set -euo pipefail
          missing=0
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_REF EXPOR_RESEND_API_KEY EXPOR_EMAIL_FROM EXPOR_NOTIFY_RECIPIENTS EXPOR_ALLOWED_ORIGINS; do
            var="S_${name}"
            if [[ -n "${!var}" ]]; then state="VERIFIED"; else state="FAIL"; missing=1; fi
            echo "$state  $name presente"
            echo "| Secret \`$name\` presente (não vazio) | $state | o valor não é lido nem impresso |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$missing"

      - uses: supabase/setup-cli@1dedf2c611547ede7232d26866dd3c56ab903bbb # v1.7.3
        with:
          version: 2.109.1

      - name: Token Supabase — leituras e âmbito
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          row() { echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; echo "$2  $1"; }
          # 1) Edge Functions: Read no projecto configurado + a função de produção existe nele.
          if supabase functions list --project-ref "$PROJECT_REF" -o json >"$tmp/functions.json" 2>"$tmp/err1"; then
            row "Token: Edge Functions Read no projecto configurado" VERIFIED "\`functions list\` com sucesso"
            if jq -e 'map(.slug) | index("exhibition-proposal-intake") != null' "$tmp/functions.json" >/dev/null; then
              row "Projecto configurado aloja \`exhibition-proposal-intake\`" VERIFIED "evidência de que é o projecto de produção do formulário"
            else
              row "Projecto configurado aloja \`exhibition-proposal-intake\`" FAIL "função não encontrada: projecto errado?"; exit 1
            fi
          else
            row "Token: Edge Functions Read no projecto configurado" FAIL "\`functions list\` recusado ou com erro"; exit 1
          fi
          # 2) Edge Function Secrets: Read (só nomes; digests nunca impressos).
          if supabase secrets list --project-ref "$PROJECT_REF" -o json >"$tmp/secrets.json" 2>"$tmp/err2"; then
            row "Token: Edge Function Secrets Read" VERIFIED "\`secrets list\` com sucesso"
            for name in EXPOR_RESEND_API_KEY EXPOR_EMAIL_FROM EXPOR_NOTIFY_RECIPIENTS ALLOWED_ORIGINS; do
              if jq -e --arg n "$name" 'map(.name) | index($n) != null' "$tmp/secrets.json" >/dev/null; then
                row "Função tem o secret \`$name\`" VERIFIED "nome presente na função publicada"
              else
                row "Função tem o secret \`$name\`" UNKNOWN "nome ausente; o próximo deploy aplica-o"
              fi
            done
          else
            row "Token: Edge Function Secrets Read" NOT\ VERIFIED "recusado: o token pode não ter Read (o deploy precisa de Read-write)"
          fi
          # 3) Âmbito. Um token clássico lista todos os projectos da conta; uma conta com um só
          #    projecto devolve a mesma lista que um token limitado — por isso esse caso é UNKNOWN.
          if supabase projects list -o json >"$tmp/projects.json" 2>"$tmp/err3"; then
            total="$(jq 'length' "$tmp/projects.json")"
            if [[ "$total" -gt 1 ]]; then
              row "Token limitado a um só projecto" "VERIFIED (NÃO limitado)" "vê $total projectos: token com âmbito de conta ou de organização"
              echo "::warning::Token vê $total projectos — recomendado token limitado ao projecto"
            else
              row "Token limitado a um só projecto" UNKNOWN "a lista só tem 1 projecto: indistinguível de um token clássico numa conta com 1 projecto"
            fi
          elif grep -qiE "permission|forbidden|401|403" "$tmp/err3"; then
            row "Token não é clássico (sem Projects account-wide)" VERIFIED "listagem de projectos recusada por permissão"
            row "Token limitado a um só projecto" NOT\ VERIFIED "a recusa prova âmbito reduzido, não que seja um único projecto"
          else
            row "Token limitado a um só projecto" UNKNOWN "erro sem indicação de permissão"
          fi
          row "Token: Edge Functions Read-write (deploy)" NOT\ VERIFIED "só demonstrável num deploy autorizado"
          row "Token: Edge Function Secrets Read-write (secrets set)" NOT\ VERIFIED "só demonstrável num deploy autorizado"
          rm -rf "$tmp"

      - name: Chave Resend — nível de permissão (sem enviar e-mail)
        env:
          RESEND_KEY: ${{ secrets.EXPOR_RESEND_API_KEY }}
        run: |
          set -euo pipefail
          tmp="$(mktemp)"
          row() { echo "| $1 | $2 | $3 |" >> "$GITHUB_STEP_SUMMARY"; echo "$2  $1"; }
          # GET /domains: chave de acesso total → 200; chave só de envio → 401 restricted_api_key
          # (código de erro documentado pelo Resend). Não envia nenhum e-mail.
          code="$(curl -sS -o "$tmp" -w '%{http_code}' -H "Authorization: Bearer ${RESEND_KEY}" https://api.resend.com/domains || true)"
          kind="$(jq -r '.name // empty' "$tmp" 2>/dev/null || true)"
          rm -f "$tmp"
          case "$code:$kind" in
            401:restricted_api_key) row "Chave Resend restrita a envio (sem leitura de recursos)" VERIFIED "API respondeu \`restricted_api_key\`";;
            200:*) row "Chave Resend restrita a envio" "VERIFIED (NÃO restrita)" "acesso total à API"; echo "::warning::chave Resend com acesso total";;
            *) row "Chave Resend reconhecida" FAIL "HTTP $code"; exit 1;;
          esac
          row "Chave Resend limitada ao domínio do remetente" NOT\ VERIFIED "só verificável no painel ou num envio"
          row "Envio de e-mail com a chave" NOT\ VERIFIED "requer envio de teste autorizado"

      - name: Higiene dos logs
        run: |
          {
            echo "| Valores secretos ausentes dos logs | NOT VERIFIED | desenho sem eco + máscara do GitHub; confirmar revendo o log deste run |"
            echo
            echo "Nenhum deploy, nenhuma escrita, nenhum e-mail enviado."
          } >> "$GITHUB_STEP_SUMMARY"
