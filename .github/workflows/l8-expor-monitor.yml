# L8 (Item 2) — monitorização da disponibilidade do formulário «Quero expor».
# A cada 30 min: DNS → TLS → OPTIONS (CORS do site) → GET (405 esperado) do endpoint que o site
# publicado usa. Sem POST de propostas, sem e-mails, sem secrets (só GITHUB_TOKEN para as issues).
# Estado entre execuções na cache do Actions; alerta = issue «l8-monitor» ao entrar em DOWN
# (uma só), comentário + fecho ao recuperar. O job não falha por o serviço estar em baixo
# (evita um e-mail de «run failed» a cada 30 min); só falha se o próprio monitor partir.
# Ver docs/website/L8_MONITORIZACAO_QUERO_EXPOR.md.

name: L8 Quero expor monitor

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: l8-expor-monitor
  cancel-in-progress: false

jobs:
  monitor:
    name: l8-expor-monitor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write # abrir, comentar e fechar a issue de alerta «l8-monitor» (sem outras escritas)
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
          sparse-checkout: scripts/monitor
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
      - name: Restaurar estado
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .l8-state
          key: l8-state-${{ github.run_id }}
          restore-keys: l8-state-
      - name: Verificar endpoint
        env:
          L8_STATE_FILE: .l8-state/state.json
          EXPOR_ENDPOINT_VAR: ${{ vars.MILREU_EXPOR_ENDPOINT }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p .l8-state
          node scripts/monitor/expor-health.mjs
      - name: Guardar estado
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: .l8-state
          key: l8-state-${{ github.run_id }}
