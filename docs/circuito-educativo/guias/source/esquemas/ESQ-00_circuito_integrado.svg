s-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">três níveis</text><rect x="100" y="1010.0" width="1400" height="150" rx="10" fill="#FFFCF7" stroke="#A83227" stroke-width="3" stroke-dasharray="14 10"/><text x="800.0" y="1065.0" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">Transversais: passaporte (um carimbo por estação), texto e pictogramas em todos os postos,</text><text x="800.0" y="1097.5" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">mediação e desenhos para o livro, quebra-cabeças em dia de chuva ou como apoio à mediação</text><text x="800.0" y="1228.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7A716A" text-anchor="middle" font-weight="normal">Esquema de organização elaborado para este guia. As estações 5 e 7 estão fora do escopo actual (21-11-2026).</text></svg>