<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600"><!-- © 2026 Fernando Rodrigues de Jácomo. Produzido no âmbito do Projecto Comunitário de Milreu. --><defs><marker id="seta" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1E1A17"/></marker></defs><rect width="1600" height="1600" fill="#FFFCF7"/><text x="800.0" y="410.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Circuito integrado: ordem pedagógica sugerida (nenhuma estação depende de outra)</text><rect x="60" y="490.0" width="240" height="170" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="180.0" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">1 Escavação</text><text x="180.0" y="579.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">simulada</text><rect x="370" y="490.0" width="240" height="170" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="490.0" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">2 Mosaicos</text><text x="490.0" y="579.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">ou 3 Estratigrafia</text><rect x="680" y="490.0" width="240" height="170" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="800.0" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">3 Estratigrafia</text><text x="800.0" y="579.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">ou 2 Mosaicos</text><rect x="990" y="490.0" width="240" height="170" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="1110.0" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">4 Montagem</text><text x="1110.0" y="579.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">da villa</text><rect x="1300" y="490.0" width="240" height="170" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="1420.0" y="538.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">5 Laboratório</text><text x="1420.0" y="579.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">de Numismática</text><line x1="300" y1="575.0" x2="362" y2="575.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><line x1="610" y1="575.0" x2="672" y2="575.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><line x1="920" y1="575.0" x2="982" y2="575.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><line x1="1230" y1="575.0" x2="1292" y2="575.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><text x="800.0" y="740.0" font-family="Helvetica, Arial, sans-serif" font-size="30" fill="#A83227" text-anchor="middle" font-weight="bold">Complementos, em qualquer momento da visita</text><rect x="100" y="780.0" width="290" height="180" rx="10" fill="#E6DCCF" stroke="#1E1A17" stroke-width="3"/><text x="245.0" y="828.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">6 Oficina digital</text><text x="245.0" y="869.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">jogo de mosaicos</text><text x="245.0" y="902.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">jogo da villa</text><rect x="470" y="780.0" width="290" height="180" rx="10" fill="#E6DCCF" stroke="#1E1A17" stroke-width="3"/><text x="615.0" y="828.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">7 Caça ao tesouro</text><text x="615.0" y="869.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">só nas ruínas</text><rect x="840" y="780.0" width="290" height="180" rx="10" fill="#E6DCCF" stroke="#1E1A17" stroke-width="3"/><text x="985.0" y="828.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">8 Caderno</text><text x="985.0" y="869.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">6–10 anos</text><rect x="1210" y="780.0" width="290" height="180" rx="10" fill="#E6DCCF" stroke="#1E1A17" stroke-width="3"/><text x="1355.0" y="828.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">9 Quiz</text><text x="1355.0" y="869.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">três níveis</text><rect x="100" y="1010.0" width="1400" height="150" rx="10" fill="#FFFCF7" stroke="#A83227" stroke-width="3" stroke-dasharray="14 10"/><text x="800.0" y="1065.0" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">Transversais: passaporte (um carimbo por estação), texto e pictogramas em todos os postos,</text><text x="800.0" y="1097.5" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">mediação e desenhos para o livro, quebra-cabeças em dia de chuva ou como pista da caça ao tesouro</text><text x="800.0" y="1228.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7A716A" text-anchor="middle" font-weight="normal">Esquema de organização elaborado para este guia, a partir das fontes do Circuito. Não está à escala.</text></svg>