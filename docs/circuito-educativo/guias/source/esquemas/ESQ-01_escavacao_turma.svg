-weight="normal">ficha de proveniência</text><text x="800.0" y="1062.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">sacos etiquetados</text><text x="800.0" y="1094.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">mala por categoria</text><rect x="1080" y="940.0" width="400" height="200" rx="10" fill="#FFFCF7" stroke="#A83227" stroke-width="3"/><text x="1280.0" y="988.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Coordenação</text><text x="1280.0" y="1029.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">regras em texto e pictogramas</text><text x="1280.0" y="1062.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">«achado especial»: ossos</text><text x="1280.0" y="1094.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">partilha final</text><circle cx="102" cy="1190.0" r="22" fill="#A83227" stroke="none" stroke-width="3"/><text x="102" y="1199.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#FFFCF7" text-anchor="middle" font-weight="bold">M</text><text x="140" y="1199.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1E1A17" text-anchor="start" font-weight="normal">mediador (um por moldura)</text><circle cx="102" cy="1230.0" r="14" fill="#7A716A" stroke="none" stroke-width="3"/><text x="140" y="1239.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#1E1A17" text-anchor="start" font-weight="normal">participante</text><text x="800.0" y="1268.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7A716A" text-anchor="middle" font-weight="normal">Esquema de organização elaborado para este guia. Não está à escala e não representa Milreu.</text></svg>