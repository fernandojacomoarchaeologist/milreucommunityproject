<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600"><!-- © 2026 Fernando Rodrigues de Jácomo. Produzido no âmbito do Projecto Comunitário de Milreu. --><defs><marker id="seta" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1E1A17"/></marker></defs><rect width="1600" height="1600" fill="#FFFCF7"/><text x="800.0" y="476.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Caça ao tesouro: sequência de uma carta</text><rect x="60" y="560.0" width="240" height="220" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="180.0" y="608.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">1 Carta</text><text x="180.0" y="649.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">de desafio</text><text x="180.0" y="682.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">imagem + pista</text><rect x="370" y="560.0" width="240" height="220" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="490.0" y="608.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">2 Procurar</text><text x="490.0" y="649.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">só em zonas</text><text x="490.0" y="682.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">visitáveis</text><rect x="680" y="560.0" width="240" height="220" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="800.0" y="608.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">3 Registar</text><text x="800.0" y="649.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">fotografia ou</text><text x="800.0" y="682.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">descrição oral</text><rect x="990" y="560.0" width="240" height="220" rx="10" fill="#FFFCF7" stroke="#A83227" stroke-width="3"/><text x="1110.0" y="608.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">4 Validar</text><text x="1110.0" y="649.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">no ponto de</text><text x="1110.0" y="682.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">validação</text><rect x="1300" y="560.0" width="240" height="220" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="1420.0" y="608.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">5 Receber</text><text x="1420.0" y="649.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">carta</text><text x="1420.0" y="682.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">coleccionável</text><line x1="300" y1="670.0" x2="362" y2="670.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><line x1="610" y1="670.0" x2="672" y2="670.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><line x1="920" y1="670.0" x2="982" y2="670.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><line x1="1230" y1="670.0" x2="1292" y2="670.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><rect x="200" y="850.0" width="1200" height="230" rx="10" fill="#E6DCCF" stroke="#1E1A17" stroke-width="3"/><text x="800.0" y="898.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Alternativas previstas</text><text x="800.0" y="939.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">sem telemóvel: validação por descrição, observação ou escolha de imagem;</text><text x="800.0" y="972.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">ponto inacessível: pista e imagem mediadas, sem dizer que substituem a visita;</text><text x="800.0" y="1004.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">percurso, fotografia e ponto de validação dependem da entidade que gere as ruínas</text><text x="800.0" y="1158.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7A716A" text-anchor="middle" font-weight="normal">Esquema de sequência elaborado para este guia. Não representa o percurso nas ruínas nem está à escala.</text></svg>