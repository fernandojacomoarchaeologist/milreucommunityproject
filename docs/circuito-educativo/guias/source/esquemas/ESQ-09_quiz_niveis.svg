<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600"><!-- © 2026 Fernando Rodrigues de Jácomo. Produzido no âmbito do Projecto Comunitário de Milreu. --><defs><marker id="seta" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1E1A17"/></marker></defs><rect width="1600" height="1600" fill="#FFFCF7"/><text x="800.0" y="446.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Quiz: três níveis de escolha livre e comentário a cada resposta</text><rect x="120" y="510.0" width="420" height="190" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="330.0" y="558.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Fácil</text><text x="330.0" y="599.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">reconhecer imagens,</text><text x="330.0" y="632.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">2 ou 3 opções</text><rect x="590" y="510.0" width="420" height="190" rx="10" fill="#E6DCCF" stroke="#1E1A17" stroke-width="3"/><text x="800.0" y="558.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Médio</text><text x="800.0" y="599.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">relacionar edifícios,</text><text x="800.0" y="632.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">objectos e épocas</text><rect x="1060" y="510.0" width="420" height="190" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="1270.0" y="558.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor=