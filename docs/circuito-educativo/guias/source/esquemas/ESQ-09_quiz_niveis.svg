0" y1="875.0" x2="602" y2="875.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><line x1="990" y1="875.0" x2="1092" y2="875.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><line x1="1290" y1="960.0" x2="1290" y2="1040.0" stroke="#7A716A" stroke-width="3"/><line x1="1290" y1="1040.0" x2="310" y2="1040.0" stroke="#7A716A" stroke-width="3"/><line x1="310" y1="1040.0" x2="310" y2="970.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><text x="800" y="1080.0" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">próxima pergunta; modo sem tempo recomendado; a pontuação não penaliza hipóteses</text><text x="800.0" y="1188.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7A716A" text-anchor="middle" font-weight="normal">Esquema de organização elaborado para este guia. Não está à escala e não representa Milreu.</text></svg>