ct x="580" y="770.0" width="440" height="230" rx="10" fill="#E6DCCF" stroke="#1E1A17" stroke-width="3"/><text x="800.0" y="818.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Edição</text><text x="800.0" y="859.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">desenho da criança;</text><text x="800.0" y="892.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">texto adaptado pelo</text><text x="800.0" y="924.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">investigador, assinalado</text><rect x="1100" y="770.0" width="440" height="230" rx="10" fill="#FFFCF7" stroke="#A83227" stroke-width="3"/><text x="1320.0" y="818.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Livro</text><text x="1320.0" y="859.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">50 páginas, digital</text><text x="1320.0" y="892.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">e papel (500 ex.),</text><text x="1320.0" y="924.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">publicação em dezembro de 2027</text><line x1="500" y1="885.0" x2="572" y2="885.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><line x1="1020" y1="885.0" x2="1092" y2="885.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><rect x="60" y="1050.0" width="1480" height="120" rx="10" fill="#FFFCF7" stroke="#A83227" stroke-width="3" stroke-dasharray="14 10"/><text x="800.0" y="1100.0" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1E1A17" text-anchor="middle" font-weight="normal">Antes do primeiro desenho: consentimento dos encarregados de educação, assentimento da criança,</text><text x="800.0" y="1131.25" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1E1A17" text-anchor="middle" font-weight="normal">autorização da escola, regras de dados, direitos sobre os desenhos e decisão sobre nomes ou pseudónimos</text><text x="800.0" y="1248.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7A716A" text-anchor="middle" font-weight="normal">Esquema de organização elaborado para este guia. Não está à escala e não representa Milreu.</text></svg>