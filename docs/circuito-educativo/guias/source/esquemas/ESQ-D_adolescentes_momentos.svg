<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1600" viewBox="0 0 1600 1600"><!-- © 2026 Fernando Rodrigues de Jácomo. Produzido no âmbito do Projecto Comunitário de Milreu. --><defs><marker id="seta" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#1E1A17"/></marker></defs><rect width="1600" height="1600" fill="#FFFCF7"/><text x="800.0" y="406.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Componente para adolescentes: três momentos com uma escola em 2027</text><rect x="60" y="480.0" width="440" height="300" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="280.0" y="528.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Momento 1</text><text x="280.0" y="569.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">roda de conversa com</text><text x="280.0" y="602.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">representantes de turma</text><text x="280.0" y="634.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">(o que interessa e afasta)</text><rect x="580" y="480.0" width="440" height="300" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="800.0" y="528.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Momento 2</text><text x="800.0" y="569.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">escavação simulada</text><text x="800.0" y="602.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">com divisão de papéis</text><text x="800.0" y="634.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">e, se autorizado, manuseio</text><text x="800.0" y="667.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">de materiais reais com luvas</text><rect x="1100" y="480.0" width="440" height="300" rx="10" fill="#F1EBE3" stroke="#1E1A17" stroke-width="3"/><text x="1320.0" y="528.0" font-family="Helvetica, Arial, sans-serif" font-size="32" fill="#1E1A17" text-anchor="middle" font-weight="bold">Momento 3</text><text x="1320.0" y="569.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">visita a um sítio em</text><text x="1320.0" y="602.1" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">escavação ou ao ICArEHB</text><text x="1320.0" y="634.6" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">(UAlg), a combinar</text><line x1="500" y1="630.0" x2="572" y2="630.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><line x1="1020" y1="630.0" x2="1092" y2="630.0" stroke="#1E1A17" stroke-width="4" marker-end="url(#seta)"/><rect x="140" y="850.0" width="300" height="110" rx="10" fill="#E6DCCF" stroke="#1E1A17" stroke-width="3"/><text x="290.0" y="898.0" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1E1A17" text-anchor="middle" font-weight="bold">escavar</text><rect x="480" y="850.0" width="300" height="110" rx="10" fill="#E6DCCF" stroke="#1E1A17" stroke-width="3"/><text x="630.0" y="898.0" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1E1A17" text-anchor="middle" font-weight="bold">registar</text><rect x="820" y="850.0" width="300" height="110" rx="10" fill="#E6DCCF" stroke="#1E1A17" stroke-width="3"/><text x="970.0" y="898.0" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1E1A17" text-anchor="middle" font-weight="bold">fotografar</text><rect x="1160" y="850.0" width="300" height="110" rx="10" fill="#E6DCCF" stroke="#1E1A17" stroke-width="3"/><text x="1310.0" y="898.0" font-family="Helvetica, Arial, sans-serif" font-size="28" fill="#1E1A17" text-anchor="middle" font-weight="bold">interpretar</text><text x="800.0" y="1010.0" font-family="Helvetica, Arial, sans-serif" font-size="26" fill="#1E1A17" text-anchor="middle" font-weight="normal">papéis rotativos dentro de cada moldura</text><rect x="60" y="1050.0" width="1480" height="130" rx="10" fill="#FFFCF7" stroke="#A83227" stroke-width="3" stroke-dasharray="14 10"/><text x="800.0" y="1100.0" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1E1A17" text-anchor="middle" font-weight="normal">Presença de professores e assistentes operacionais da escola; autorização da entidade que detém</text><text x="800.0" y="1131.25" font-family="Helvetica, Arial, sans-serif" font-size="25" fill="#1E1A17" text-anchor="middle" font-weight="normal">os materiais reais; autorização dos encarregados de educação para saídas e registos</text><text x="800.0" y="1228.0" font-family="Helvetica, Arial, sans-serif" font-size="24" fill="#7A716A" text-anchor="middle" font-weight="normal">Esquema de organização elaborado para este guia. Não está à escala e não representa Milreu.</text></svg>