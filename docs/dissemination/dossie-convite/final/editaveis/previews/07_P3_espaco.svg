<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="154mm" height="216mm" viewBox="0 0 1819 2551"><rect x="0" y="0" width="1819" height="2551" fill="rgb(255,252,247)"/><text x="165.00" y="188.00" font-family="Spectral,serif" font-size="33" fill="rgb(168,50,39)" text-anchor="start" font-weight="500" letter-spacing="5.00">A EXPOSIÇÃO NO SEU ESPAÇO</text><text x="165.00" y="289.00" font-family="Fraunces,serif" font-size="54" fill="rgb(30,26,23)" text-anchor="start" font-weight="600">12 painéis verticais · 841 × 1800 mm</text><text x="165.00" y="336.00" font-family="Spectral,serif" font-size="35" fill="rgb(118,109,100)" text-anchor="start" font-style="italic">PVC expandido, impressão em vinil laminado</text><text x="165.00" y="403.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">«Entre Ruínas e Memórias» é composta por 12 painéis individuais, montados em estruturas de dupla</text><text x="165.00" y="447.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">face: cada estrutura recebe um painel na frente e outro no verso.</text><text x="165.00" y="538.00" font-family="Spectral,serif" font-size="33" fill="rgb(168,50,39)" text-anchor="start" font-weight="500" letter-spacing="5.00">ORDENAÇÃO — FRENTE E VERSO</text><text x="165.00" y="609.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">Seis estruturas recebem os 12 painéis. O percurso faz-se pela frente, de Q1 a Q6; contorna-se a última</text><text x="165.00" y="653.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">estrutura e regressa-se pelo verso, de Q7 a Q12. Abertura (Q1) e fecho (Q12) ficam na mesma estrutura,</text><text x="165.00" y="697.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">costas com costas.</text><text x="165.00" y="771.00" font-family="Spectral,serif" font-size="33" fill="rgb(30,26,23)" text-anchor="start" font-weight="600">Em linha — suportes próprios</text><rect x="165.00" y="789.00" width="709.00" height="354.00" fill="rgb(255,252,247)" stroke="rgb(230,220,201)" stroke-width="1"/><line x1="242.72" y1="966.00" x2="303.79" y2="966.00" stroke="rgb(118,109,100)" stroke-width="12"/><line x1="341.21" y1="966.00" x2="402.29" y2="966.00" stroke="rgb(118,109,100)" stroke-width="12"/><line x1="439.71" y1="966.00" x2="500.79" y2="966.00" stroke="rgb(118,109,100)" stroke-width="12"/><line x1="538.22" y1="966.00" x2="599.28" y2="966.00" stroke="rgb(118,109,100)" stroke-width="12"/><line x1="636.72" y1="966.00" x2="697.78" y2="966.00" stroke="rgb(118,109,100)" stroke-width="12"/><line x1="735.22" y1="966.00" x2="796.28" y2="966.00" stroke="rgb(118,109,100)" stroke-width="12"/><text x="273.25" y="930.00" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q1</text><text x="273.25" y="1024.50" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q12</text><text x="371.75" y="930.00" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q2</text><text x="371.75" y="1024.50" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q11</text><text x="470.25" y="930.00" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q3</text><text x="470.25" y="1024.50" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q10</text><text x="568.75" y="930.00" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q4</text><text x="568.75" y="1024.50" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q9</text><text x="667.25" y="930.00" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q5</text><text x="667.25" y="1024.50" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q8</text><text x="765.75" y="930.00" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q6</text><text x="765.75" y="1024.50" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q7</text><line x1="224.00" y1="827.00" x2="815.00" y2="827.00" stroke="rgb(168,50,39)" stroke-width="1"/><line x1="815.00" y1="827.00" x2="802.00" y2="817.90" stroke="rgb(168,50,39)" stroke-width="1"/><line x1="815.00" y1="827.00" x2="802.00" y2="836.10" stroke="rgb(168,50,39)" stroke-width="1"/><line x1="815.00" y1="1105.00" x2="224.00" y2="1105.00" stroke="rgb(118,109,100)" stroke-width="1"/><line x1="224.00" y1="1105.00" x2="237.00" y2="1095.90" stroke="rgb(118,109,100)" stroke-width="1"/><line x1="224.00" y1="1105.00" x2="237.00" y2="1114.10" stroke="rgb(118,109,100)" stroke-width="1"/><line x1="815.00" y1="827.00" x2="834.00" y2="827.00" stroke="rgb(176,164,145)" stroke-width="1"/><line x1="834.00" y1="827.00" x2="834.00" y2="1105.00" stroke="rgb(176,164,145)" stroke-width="1"/><line x1="834.00" y1="1105.00" x2="815.00" y2="1105.00" stroke="rgb(176,164,145)" stroke-width="1"/><text x="165.00" y="1191.00" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="start">Suportes isolados, espaçados conforme a circulação.</text><text x="945.00" y="771.00" font-family="Spectral,serif" font-size="33" fill="rgb(30,26,23)" text-anchor="start" font-weight="600">Em ziguezague — estruturas AAMLF</text><rect x="945.00" y="789.00" width="709.00" height="354.00" fill="rgb(255,252,247)" stroke="rgb(230,220,201)" stroke-width="1"/><line x1="1004.00" y1="944.07" x2="1102.50" y2="987.93" stroke="rgb(118,109,100)" stroke-width="12"/><line x1="1102.50" y1="987.93" x2="1201.00" y2="944.07" stroke="rgb(118,109,100)" stroke-width="12"/><line x1="1201.00" y1="944.07" x2="1299.50" y2="987.93" stroke="rgb(118,109,100)" stroke-width="12"/><line x1="1299.50" y1="987.93" x2="1398.00" y2="944.07" stroke="rgb(118,109,100)" stroke-width="12"/><line x1="1398.00" y1="944.07" x2="1496.50" y2="987.93" stroke="rgb(118,109,100)" stroke-width="12"/><line x1="1496.50" y1="987.93" x2="1595.00" y2="944.07" stroke="rgb(118,109,100)" stroke-width="12"/><ellipse cx="1004.00" cy="944.07" rx="8.00" ry="8.00" fill="rgb(118,109,100)"/><ellipse cx="1102.50" cy="987.93" rx="8.00" ry="8.00" fill="rgb(118,109,100)"/><ellipse cx="1201.00" cy="944.07" rx="8.00" ry="8.00" fill="rgb(118,109,100)"/><ellipse cx="1299.50" cy="987.93" rx="8.00" ry="8.00" fill="rgb(118,109,100)"/><ellipse cx="1398.00" cy="944.07" rx="8.00" ry="8.00" fill="rgb(118,109,100)"/><ellipse cx="1496.50" cy="987.93" rx="8.00" ry="8.00" fill="rgb(118,109,100)"/><ellipse cx="1595.00" cy="944.07" rx="8.00" ry="8.00" fill="rgb(118,109,100)"/><text x="1053.25" y="908.07" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q1</text><text x="1053.25" y="1040.95" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q12</text><text x="1151.75" y="908.07" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q2</text><text x="1151.75" y="1040.95" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q11</text><text x="1250.25" y="908.07" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q3</text><text x="1250.25" y="1040.95" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q10</text><text x="1348.75" y="908.07" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q4</text><text x="1348.75" y="1040.95" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q9</text><text x="1447.25" y="908.07" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q5</text><text x="1447.25" y="1040.95" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q8</text><text x="1545.75" y="908.07" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="middle" font-weight="600">Q6</text><text x="1545.75" y="1040.95" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="middle" font-weight="600">Q7</text><line x1="1004.00" y1="827.00" x2="1595.00" y2="827.00" stroke="rgb(168,50,39)" stroke-width="1"/><line x1="1595.00" y1="827.00" x2="1582.00" y2="817.90" stroke="rgb(168,50,39)" stroke-width="1"/><line x1="1595.00" y1="827.00" x2="1582.00" y2="836.10" stroke="rgb(168,50,39)" stroke-width="1"/><line x1="1595.00" y1="1105.00" x2="1004.00" y2="1105.00" stroke="rgb(118,109,100)" stroke-width="1"/><line x1="1004.00" y1="1105.00" x2="1017.00" y2="1095.90" stroke="rgb(118,109,100)" stroke-width="1"/><line x1="1004.00" y1="1105.00" x2="1017.00" y2="1114.10" stroke="rgb(118,109,100)" stroke-width="1"/><line x1="1595.00" y1="827.00" x2="1614.00" y2="827.00" stroke="rgb(176,164,145)" stroke-width="1"/><line x1="1614.00" y1="827.00" x2="1614.00" y2="1105.00" stroke="rgb(176,164,145)" stroke-width="1"/><line x1="1614.00" y1="1105.00" x2="1595.00" y2="1105.00" stroke="rgb(176,164,145)" stroke-width="1"/><text x="945.00" y="1191.00" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="start">Estruturas presas entre si; a ordem mantém-se.</text><text x="165.00" y="1249.00" font-family="Spectral,serif" font-size="28" fill="rgb(118,109,100)" text-anchor="start" font-style="italic">Vista de topo · </text><text x="338.00" y="1249.00" font-family="Spectral,serif" font-size="28" fill="rgb(168,50,39)" text-anchor="start" font-style="italic">frente (ida)</text><text x="462.00" y="1249.00" font-family="Spectral,serif" font-size="28" fill="rgb(118,109,100)" text-anchor="start" font-style="italic"> · verso (regresso)</text><text x="165.00" y="1348.00" font-family="Spectral,serif" font-size="33" fill="rgb(168,50,39)" text-anchor="start" font-weight="500" letter-spacing="5.00">ESTRUTURAS</text><rect x="165.00" y="1396.00" width="15.00" height="15.00" fill="rgb(168,50,39)"/><text x="208.00" y="1418.00" font-family="Spectral,serif" font-size="32" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">Estruturas metálicas — AAMLF.</text><text x="687.00" y="1418.00" font-family="Spectral,serif" font-size="32" fill="rgb(69,61,54)" text-anchor="start">Sete estruturas de dupla face, presas entre si, mediante consulta à</text><text x="208.00" y="1460.00" font-family="Spectral,serif" font-size="32" fill="rgb(69,61,54)" text-anchor="start">AAMLF sobre disponibilidade.</text><rect x="165.00" y="1506.00" width="15.00" height="15.00" fill="rgb(168,50,39)"/><text x="208.00" y="1528.00" font-family="Spectral,serif" font-size="32" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">Suportes próprios.</text><text x="477.00" y="1528.00" font-family="Spectral,serif" font-size="32" fill="rgb(69,61,54)" text-anchor="start">Solução mais simples, também de dupla face, mediante apontamento.</text><text x="165.00" y="1614.00" font-family="Spectral,serif" font-size="32" fill="rgb(118,109,100)" text-anchor="start" font-style="italic">Em qualquer sistema, cada estrutura recebe apenas dois painéis e a ordem de leitura mantém-se. A configuração</text><text x="165.00" y="1656.00" font-family="Spectral,serif" font-size="32" fill="rgb(118,109,100)" text-anchor="start" font-style="italic">final é acordada com cada espaço anfitrião.</text><text x="165.00" y="1740.00" font-family="Spectral,serif" font-size="33" fill="rgb(168,50,39)" text-anchor="start" font-weight="500" letter-spacing="5.00">AMBIENTE</text><text x="165.00" y="1811.00" font-family="Spectral,serif" font-size="33" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">A exposição destina-se a espaços interiores.</text><text x="165.00" y="1866.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">Em exterior, apenas por um período máximo de 4 horas e com o acompanhamento de um responsável</text><text x="165.00" y="1909.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">do projecto.</text><rect x="165.00" y="1964.00" width="1489.00" height="7.00" fill="rgb(230,220,201)"/><text x="165.00" y="2046.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start" font-weight="500" letter-spacing="5.00">O QUE PRECISAMOS DE SABER SOBRE O SEU ESPAÇO</text><rect x="165.00" y="2094.00" width="15.00" height="15.00" fill="rgb(168,50,39)"/><text x="208.00" y="2118.00" font-family="Spectral,serif" font-size="34" fill="rgb(69,61,54)" text-anchor="start">espaço interior · dimensões / área disponível</text><rect x="165.00" y="2158.00" width="15.00" height="15.00" fill="rgb(168,50,39)"/><text x="208.00" y="2182.00" font-family="Spectral,serif" font-size="34" fill="rgb(69,61,54)" text-anchor="start">condições de circulação e montagem</text><rect x="165.00" y="2222.00" width="15.00" height="15.00" fill="rgb(168,50,39)"/><text x="208.00" y="2246.00" font-family="Spectral,serif" font-size="34" fill="rgb(69,61,54)" text-anchor="start">contacto da pessoa responsável</text></svg>