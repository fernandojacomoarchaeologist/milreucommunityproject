<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="154mm" height="216mm" viewBox="0 0 1819 2551"><rect x="0" y="0" width="1819" height="2551" fill="rgb(255,252,247)"/><text x="165.00" y="188.00" font-family="Spectral,serif" font-size="33" fill="rgb(168,50,39)" text-anchor="start" font-weight="500" letter-spacing="5.00">A EXPOSIÇÃO NO SEU ESPAÇO</text><text x="165.00" y="289.00" font-family="Fraunces,serif" font-size="54" fill="rgb(30,26,23)" text-anchor="start" font-weight="600">12 painéis verticais · 841 × 1800 mm</text><text x="165.00" y="351.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">«Entre Ruínas e Memórias» é composta por 12 painéis individuais. A implantação é adaptada ao</text><text x="165.00" y="395.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">espaço anfitrião, às condições de circulação e ao sistema de montagem disponível.</text><text x="165.00" y="486.00" font-family="Spectral,serif" font-size="33" fill="rgb(168,50,39)" text-anchor="start" font-weight="500" letter-spacing="5.00">COM ESTRUTURAS EXPOSITIVAS</text><text x="165.00" y="557.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">O projecto dispõe, através da AAMLF, de sete estruturas metálicas expositivas utilizáveis nas duas</text><text x="165.00" y="601.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">faces, correspondendo a até 14 superfícies de montagem. Para garantir estabilidade, as estruturas são</text><text x="165.00" y="645.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">associadas entre si, podendo organizar-se em núcleos de 2 + 2 + 3 ou num percurso contínuo em</text><text x="165.00" y="689.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start">ziguezague.</text><text x="165.00" y="763.00" font-family="Spectral,serif" font-size="33" fill="rgb(30,26,23)" text-anchor="start" font-weight="600">Em núcleos — 2 + 2 + 3</text><rect x="165.00" y="781.00" width="709.00" height="295.00" fill="rgb(255,252,247)" stroke="rgb(230,220,201)" stroke-width="1"/><line x1="200.00" y1="907.57" x2="262.07" y2="949.43" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="262.07" y1="949.43" x2="324.15" y2="907.57" stroke="rgb(118,109,100)" stroke-width="11"/><ellipse cx="200.00" cy="907.57" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="262.07" cy="949.43" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="324.15" cy="907.57" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><line x1="426.39" y1="907.57" x2="488.46" y2="949.43" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="488.46" y1="949.43" x2="550.54" y2="907.57" stroke="rgb(118,109,100)" stroke-width="11"/><ellipse cx="426.39" cy="907.57" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="488.46" cy="949.43" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="550.54" cy="907.57" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><line x1="652.78" y1="907.57" x2="714.85" y2="949.43" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="714.85" y1="949.43" x2="776.93" y2="907.57" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="776.93" y1="907.57" x2="839.00" y2="949.43" stroke="rgb(118,109,100)" stroke-width="11"/><ellipse cx="652.78" cy="907.57" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="714.85" cy="949.43" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="776.93" cy="907.57" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="839.00" cy="949.43" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><text x="165.00" y="1124.00" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="start">Os sete expositores podem ser organizados em três</text><text x="165.00" y="1158.00" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="start">conjuntos articulados, garantindo estabilidade ao</text><text x="165.00" y="1192.00" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="start">conjunto.</text><text x="945.00" y="763.00" font-family="Spectral,serif" font-size="33" fill="rgb(30,26,23)" text-anchor="start" font-weight="600">Ziguezague contínuo</text><rect x="945.00" y="781.00" width="709.00" height="295.00" fill="rgb(255,252,247)" stroke="rgb(230,220,201)" stroke-width="1"/><line x1="980.00" y1="897.71" x2="1071.29" y2="959.29" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="1071.29" y1="959.29" x2="1162.57" y2="897.71" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="1162.57" y1="897.71" x2="1253.86" y2="959.29" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="1253.86" y1="959.29" x2="1345.14" y2="897.71" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="1345.14" y1="897.71" x2="1436.43" y2="959.29" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="1436.43" y1="959.29" x2="1527.71" y2="897.71" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="1527.71" y1="897.71" x2="1619.00" y2="959.29" stroke="rgb(118,109,100)" stroke-width="11"/><ellipse cx="980.00" cy="897.71" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="1071.29" cy="959.29" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="1162.57" cy="897.71" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="1253.86" cy="959.29" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="1345.14" cy="897.71" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="1436.43" cy="959.29" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="1527.71" cy="897.71" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><ellipse cx="1619.00" cy="959.29" rx="9.00" ry="9.00" fill="rgb(168,50,39)"/><text x="945.00" y="1124.00" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="start">Os sete expositores podem formar uma sequência</text><text x="945.00" y="1158.00" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="start">articulada, aproveitando as duas faces e garantindo</text><text x="945.00" y="1192.00" font-family="Spectral,serif" font-size="28" fill="rgb(69,61,54)" text-anchor="start">estabilidade ao conjunto.</text><text x="165.00" y="1270.00" font-family="Spectral,serif" font-size="32" fill="rgb(118,109,100)" text-anchor="start" font-style="italic">Os 12 painéis são peças individuais. As sete estruturas disponibilizam até 14 faces de montagem, permitindo</text><text x="165.00" y="1312.00" font-family="Spectral,serif" font-size="32" fill="rgb(118,109,100)" text-anchor="start" font-style="italic">adaptar a distribuição dos painéis à circulação e ao espaço disponível.</text><text x="165.00" y="1396.00" font-family="Spectral,serif" font-size="33" fill="rgb(168,50,39)" text-anchor="start" font-weight="500" letter-spacing="5.00">MONTAGEM AUTÓNOMA — EM DESENVOLVIMENTO</text><rect x="165.00" y="1432.00" width="449.00" height="260.00" fill="rgb(255,252,247)" stroke="rgb(230,220,201)" stroke-width="1"/><rect x="361.98" y="1467.00" width="55.04" height="117.80" fill="rgb(255,252,247)" stroke="rgb(181,170,155)" stroke-width="11"/><rect x="361.98" y="1467.00" width="55.04" height="7.07" fill="rgb(168,50,39)"/><line x1="378.49" y1="1584.80" x2="363.08" y2="1643.80" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="400.51" y1="1584.80" x2="415.92" y2="1643.80" stroke="rgb(118,109,100)" stroke-width="11"/><line x1="337.98" y1="1643.80" x2="441.02" y2="1643.80" stroke="rgb(176,164,145)" stroke-width="1"/><text x="389.50" y="1735.00" font-family="Spectral,serif" font-size="26" fill="rgb(118,109,100)" text-anchor="middle" font-style="italic">Esquema conceptual</text><text x="673.00" y="1478.00" font-family="Spectral,serif" font-size="32" fill="rgb(69,61,54)" text-anchor="start">Está em desenvolvimento um sistema de apoios próprios para os</text><text x="673.00" y="1520.00" font-family="Spectral,serif" font-size="32" fill="rgb(69,61,54)" text-anchor="start">painéis, com o objectivo de permitir montagem autónoma, maior</text><text x="673.00" y="1562.00" font-family="Spectral,serif" font-size="32" fill="rgb(69,61,54)" text-anchor="start">flexibilidade nas itinerâncias e menor dependência do transporte das</text><text x="673.00" y="1604.00" font-family="Spectral,serif" font-size="32" fill="rgb(69,61,54)" text-anchor="start">estruturas metálicas.</text><text x="165.00" y="1776.00" font-family="Spectral,serif" font-size="32" fill="rgb(118,109,100)" text-anchor="start" font-style="italic">A configuração final é acordada com cada espaço anfitrião, considerando área disponível, circulação, segurança,</text><text x="165.00" y="1818.00" font-family="Spectral,serif" font-size="32" fill="rgb(118,109,100)" text-anchor="start" font-style="italic">transporte e condições de montagem.</text><rect x="165.00" y="1867.00" width="1489.00" height="7.00" fill="rgb(230,220,201)"/><text x="165.00" y="1949.00" font-family="Spectral,serif" font-size="33" fill="rgb(69,61,54)" text-anchor="start" font-weight="500" letter-spacing="5.00">O QUE PRECISAMOS DE SABER SOBRE O SEU ESPAÇO</text><rect x="165.00" y="1997.00" width="15.00" height="15.00" fill="rgb(168,50,39)"/><text x="208.00" y="2021.00" font-family="Spectral,serif" font-size="34" fill="rgb(69,61,54)" text-anchor="start">dimensões / área disponível</text><rect x="165.00" y="2061.00" width="15.00" height="15.00" fill="rgb(168,50,39)"/><text x="208.00" y="2085.00" font-family="Spectral,serif" font-size="34" fill="rgb(69,61,54)" text-anchor="start">condições de circulação e montagem</text><rect x="165.00" y="2125.00" width="15.00" height="15.00" fill="rgb(168,50,39)"/><text x="208.00" y="2149.00" font-family="Spectral,serif" font-size="34" fill="rgb(69,61,54)" text-anchor="start">contacto da pessoa responsável</text></svg>