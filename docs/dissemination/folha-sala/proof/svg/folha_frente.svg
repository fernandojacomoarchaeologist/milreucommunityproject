<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="210mm" height="297mm" viewBox="0 0 2480 3508"><rect x="0" y="0" width="2480" height="3508" fill="rgb(255,252,247)"/><text x="213.00" y="267.00" font-family="Archivo,sans-serif" font-size="35" fill="rgb(168,50,39)" text-anchor="start" font-weight="600" letter-spacing="5.00">MUSEU · PROJECTO COMUNITÁRIO DE MILREU</text><text x="213.00" y="324.00" font-family="Archivo,sans-serif" font-size="30" fill="rgb(118,109,100)" text-anchor="start" font-weight="600" letter-spacing="4.00">MUSEUS SEM FRONTEIRAS · INICIATIVAS 2026</text><text x="213.00" y="566.00" font-family="Fraunces,serif" font-size="142" fill="rgb(30,26,23)" text-anchor="start" font-weight="600">Entre Ruínas e Memórias</text><text x="213.00" y="698.00" font-family="Spectral,serif" font-size="52" fill="rgb(118,109,100)" text-anchor="start" font-style="italic">Museu itinerante sobre as relações entre a população e as Ruínas Romanas de</text><text x="213.00" y="767.00" font-family="Spectral,serif" font-size="52" fill="rgb(118,109,100)" text-anchor="start" font-style="italic">Milreu</text><text x="213.00" y="913.00" font-family="Spectral,serif" font-size="47" fill="rgb(69,61,54)" text-anchor="start">«Entre Ruínas e Memórias» reúne fotografias, testemunhos e outros registos ligados às relações</text><text x="213.00" y="985.00" font-family="Spectral,serif" font-size="47" fill="rgb(69,61,54)" text-anchor="start">entre a população e as Ruínas Romanas de Milreu. Mais do que contar apenas a história</text><text x="213.00" y="1057.00" font-family="Spectral,serif" font-size="47" fill="rgb(69,61,54)" text-anchor="start">arqueológica do sítio, a exposição procura tornar visíveis as memórias, experiências e relações</text><text x="213.00" y="1129.00" font-family="Spectral,serif" font-size="47" fill="rgb(69,61,54)" text-anchor="start">construídas com Milreu ao longo do tempo.</text><text x="213.00" y="1248.00" font-family="Spectral,serif" font-size="47" fill="rgb(69,61,54)" text-anchor="start">Os 12 painéis percorrem diferentes momentos dessa relação — das primeiras escavações às</text><text x="213.00" y="1320.00" font-family="Spectral,serif" font-size="47" fill="rgb(69,61,54)" text-anchor="start">memórias das equipas, das festas e vivências locais às mensagens deixadas para o futuro.</text><line x1="213.00" y1="1472.00" x2="2267.00" y2="1472.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="213.00" y="1586.00" font-family="Archivo,sans-serif" font-size="35" fill="rgb(168,50,39)" text-anchor="start" font-weight="600" letter-spacing="5.00">COMO PERCORRER</text><text x="213.00" y="1699.00" font-family="Spectral,serif" font-size="47" fill="rgb(69,61,54)" text-anchor="start">Pode seguir a sequência 1–12 ou aproximar-se dos painéis a partir das imagens e temas que mais</text><text x="213.00" y="1771.00" font-family="Spectral,serif" font-size="47" fill="rgb(69,61,54)" text-anchor="start">lhe despertarem curiosidade. A exposição foi concebida como um percurso aberto entre</text><text x="213.00" y="1843.00" font-family="Spectral,serif" font-size="47" fill="rgb(69,61,54)" text-anchor="start">arqueologia, memória e comunidade.</text><line x1="213.00" y1="1995.00" x2="2267.00" y2="1995.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="213.00" y="2109.00" font-family="Archivo,sans-serif" font-size="35" fill="rgb(168,50,39)" text-anchor="start" font-weight="600" letter-spacing="5.00">OS 12 PAINÉIS</text><text x="213.00" y="2247.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">01</text><text x="337.00" y="2249.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="377.00" y="2251.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">Entre Ruínas e Memórias</text><line x1="213.00" y1="2324.00" x2="1181.00" y2="2324.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="213.00" y="2422.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">02</text><text x="337.00" y="2424.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="377.00" y="2426.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">As escavações em Milreu</text><line x1="213.00" y1="2499.00" x2="1181.00" y2="2499.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="213.00" y="2597.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">03</text><text x="337.00" y="2599.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="377.00" y="2601.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">A Festa da Pinha</text><line x1="213.00" y1="2674.00" x2="1181.00" y2="2674.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="213.00" y="2772.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">04</text><text x="337.00" y="2774.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="377.00" y="2776.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">Os jornalistas ingleses</text><line x1="213.00" y1="2849.00" x2="1181.00" y2="2849.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="213.00" y="2947.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">05</text><text x="337.00" y="2949.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="377.00" y="2951.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">Memórias de juventude</text><line x1="213.00" y1="3024.00" x2="1181.00" y2="3024.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="213.00" y="3122.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">06</text><text x="337.00" y="3124.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="377.00" y="3126.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">Achados romanos de Milreu</text><line x1="213.00" y1="3199.00" x2="1181.00" y2="3199.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="1299.00" y="2247.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">07</text><text x="1423.00" y="2249.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="1463.00" y="2251.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">Theodor Hauschild e a equipa</text><line x1="1299.00" y1="2324.00" x2="2267.00" y2="2324.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="1299.00" y="2422.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">08</text><text x="1423.00" y="2424.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="1463.00" y="2426.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">A equipa de Milreu</text><line x1="1299.00" y1="2499.00" x2="2267.00" y2="2499.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="1299.00" y="2597.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">09</text><text x="1423.00" y="2599.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="1463.00" y="2601.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">Trabalhar nas ruínas</text><line x1="1299.00" y1="2674.00" x2="2267.00" y2="2674.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="1299.00" y="2772.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">10</text><text x="1423.00" y="2774.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="1463.00" y="2776.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">Junto ao edifício de cultos</text><line x1="1299.00" y1="2849.00" x2="2267.00" y2="2849.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="1299.00" y="2947.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">11</text><text x="1423.00" y="2949.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="1463.00" y="2951.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500">A participação local</text><line x1="1299.00" y1="3024.00" x2="2267.00" y2="3024.00" stroke="rgb(230,220,201)" stroke-width="1"/><text x="1299.00" y="3122.00" font-family="Archivo,sans-serif" font-size="52" fill="rgb(168,50,39)" text-anchor="start" font-weight="700">12</text><text x="1423.00" y="3124.00" font-family="Spectral,serif" font-size="50" fill="rgb(181,170,155)" text-anchor="start" font-weight="500">·</text><text x="1463.00" y="3126.00" font-family="Spectral,serif" font-size="51" fill="rgb(30,26,23)" text-anchor="start" font-weight="500